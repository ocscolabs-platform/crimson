name: Verify clean crimson-staging

on:
  push:
    branches:
      - staging
    paths:
      - .github/workflows/verify-clean-crimson-staging.yml

permissions:
  contents: read

jobs:
  verify:
    name: Read-only crimson-staging verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging-supabase
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      EXPECTED_STAGING_REF: sdfbcgctquagfcrkvoyw
      EXPECTED_STAGING_NAME: crimson-staging
      EXPECTED_MIGRATION: 20260823000000_expand_pages_content_compatibility.sql
      EXPECTED_MIGRATION_COUNT: "22"
      PGHOST: aws-0-ap-northeast-1.pooler.supabase.com
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres.sdfbcgctquagfcrkvoyw
      PGSSLMODE: require

    steps:
      - name: Check out approved staging branch
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 1

      - name: Enforce staging-only execution and exact target
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF:-}" != "refs/heads/staging" ]]; then
            echo "Refusing verification outside refs/heads/staging: ${GITHUB_REF:-unset}"
            exit 1
          fi

          if [[ "${SUPABASE_PROJECT_REF:-}" != "$EXPECTED_STAGING_REF" ]]; then
            echo "Refusing verification: SUPABASE_PROJECT_REF does not equal the approved staging ref."
            exit 1
          fi

          for required in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [[ -z "${!required:-}" ]]; then
              echo "Refusing verification: $required is missing."
              exit 1
            fi
          done

      - name: Confirm canonical migration set
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t migrations < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)

          if [[ "${#migrations[@]}" -ne "$EXPECTED_MIGRATION_COUNT" ]]; then
            echo "Refusing verification: expected exactly $EXPECTED_MIGRATION_COUNT canonical SQL migrations, found ${#migrations[@]}."
            exit 1
          fi

          if ! printf '%s\n' "${migrations[@]}" | grep -Fxq "$EXPECTED_MIGRATION"; then
            echo "Refusing verification: required corrective migration is missing."
            exit 1
          fi

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Verify exact staging project identity
        shell: bash
        run: |
          set -euo pipefail

          cli_version="$(supabase --version)"
          if [[ "$cli_version" != *"2.111.0"* ]]; then
            echo "Refusing verification: unexpected Supabase CLI version: $cli_version"
            exit 1
          fi

          project_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_STAGING_REF")"
          project_ref="$(jq -r '.id // .ref // empty' <<< "$project_json")"
          project_name="$(jq -r '.name // empty' <<< "$project_json")"

          if [[ "$project_ref" != "$EXPECTED_STAGING_REF" || "$project_name" != "$EXPECTED_STAGING_NAME" ]]; then
            echo "Refusing verification: exact project identity check failed."
            exit 1
          fi

      - name: Link only the approved staging project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$EXPECTED_STAGING_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Display linked migration status
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked

      - name: Verify migration ledger exactly once
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t expected_versions < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sed -E 's/^([0-9]{14})_.+\.sql$/\1/' | sort)
          mapfile -t recorded_versions < <(
            PGPASSWORD="$SUPABASE_DB_PASSWORD" \
            psql -Atqc "select version from supabase_migrations.schema_migrations order by version"
          )

          if [[ "${#recorded_versions[@]}" -ne "$EXPECTED_MIGRATION_COUNT" ]]; then
            echo "Migration ledger does not contain exactly $EXPECTED_MIGRATION_COUNT remote versions."
            exit 1
          fi

          expected_file="$RUNNER_TEMP/expected-versions.txt"
          recorded_file="$RUNNER_TEMP/recorded-versions.txt"
          printf '%s\n' "${expected_versions[@]}" > "$expected_file"
          printf '%s\n' "${recorded_versions[@]}" > "$recorded_file"

          if ! diff -u "$expected_file" "$recorded_file"; then
            echo "Remote migration versions do not exactly match the $EXPECTED_MIGRATION_COUNT canonical Git timestamps."
            exit 1
          fi

          duplicate_count="$(
            PGPASSWORD="$SUPABASE_DB_PASSWORD" \
            psql -Atqc "select count(*) from (select version from supabase_migrations.schema_migrations group by version having count(*) <> 1) duplicates"
          )"
          if [[ "$duplicate_count" != "0" ]]; then
            echo "Migration ledger contains duplicate version rows."
            exit 1
          fi

      - name: Confirm no migrations remain pending
        shell: bash
        run: |
          set -euo pipefail
          dry_run_output="$(supabase db push --linked --dry-run)"
          printf '%s\n' "$dry_run_output"
          if ! grep -qi 'up to date' <<< "$dry_run_output"; then
            echo "Pending migrations remain or the dry-run result was not understood."
            exit 1
          fi

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Verify PageDocument compatibility and legacy rows
        shell: bash
        run: |
          set -euo pipefail

          column_contract="$({
            PGPASSWORD="$SUPABASE_DB_PASSWORD" \
            psql -Atqc "
              select data_type || '|' || is_nullable
              from information_schema.columns
              where table_schema = 'public'
                and table_name = 'pages'
                and column_name = 'content'
            "
          })"
          if [[ "$column_contract" != "jsonb|NO" ]]; then
            echo "Unexpected public.pages.content column contract: $column_contract"
            exit 1
          fi

          constraint_definition="$({
            PGPASSWORD="$SUPABASE_DB_PASSWORD" \
            psql -Atqc "
              select pg_get_constraintdef(c.oid)
              from pg_constraint c
              join pg_class t on t.oid = c.conrelid
              join pg_namespace n on n.oid = t.relnamespace
              where n.nspname = 'public'
                and t.relname = 'pages'
                and c.conname = 'pages_content_check'
            "
          })"
          if ! grep -qi 'jsonb_typeof(content)' <<< "$constraint_definition" \
            || ! grep -qi "array" <<< "$constraint_definition" \
            || ! grep -qi "object" <<< "$constraint_definition"; then
            echo "pages_content_check does not permit both JSON arrays and objects: $constraint_definition"
            exit 1
          fi

          mapfile -t page_rows < <(
            PGPASSWORD="$SUPABASE_DB_PASSWORD" \
            psql -AtF '|' -c "
              select slug, jsonb_typeof(content), status
              from public.pages
              where slug in ('home', 'services', 'about', 'contact', 'work')
              order by array_position(array['home', 'services', 'about', 'contact', 'work'], slug)
            "
          )
          if [[ "${#page_rows[@]}" -ne 5 ]]; then
            echo "Expected Home, Services, About, Contact, and Work rows; found ${#page_rows[@]}."
            exit 1
          fi

          for expected_slug in home services about contact work; do
            if ! printf '%s\n' "${page_rows[@]}" | grep -Eq "^${expected_slug}\|array\|"; then
              echo "Expected legacy array content for $expected_slug."
              printf '%s\n' "${page_rows[@]}"
              exit 1
            fi
          done

          phase5_objects="$({
            PGPASSWORD="$SUPABASE_DB_PASSWORD" \
            psql -Atqc "
              select count(*)
              from public.pages
              where slug in ('home', 'services', 'about', 'contact')
                and jsonb_typeof(content) = 'object'
            "
          })"
          if [[ "$phase5_objects" != "0" ]]; then
            echo "Phase 5 PageDocument objects already exist: $phase5_objects"
            exit 1
          fi

          page_section_coverage="$({
            PGPASSWORD="$SUPABASE_DB_PASSWORD" \
            psql -Atqc "
              select count(*)
              from public.pages p
              where p.slug in ('home', 'services', 'about', 'contact', 'work')
                and exists (select 1 from public.page_sections ps where ps.page_id = p.id)
            "
          })"
          if [[ "$page_section_coverage" != "5" ]]; then
            echo "Expected page_sections coverage for all five legacy pages; found $page_section_coverage."
            exit 1
          fi

          echo "pages.content is jsonb NOT NULL and permits array/object values."
          printf 'Legacy page rows:\n%s\n' "${page_rows[*]}"
          echo "No Phase 5 PageDocument objects or backfill rows detected."
          echo "page_sections remains present for all five legacy pages."

      - name: Run read-only release contract
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD="$SUPABASE_DB_PASSWORD" \
          psql -v ON_ERROR_STOP=1 -f supabase/verification/release-contract.sql

      - name: Assert final staging architecture read-only
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD="$SUPABASE_DB_PASSWORD" \
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            missing text;
          begin
            select string_agg(name, ', ' order by name)
              into missing
            from unnest(array[
              'site_settings', 'navigation_items', 'pages', 'page_sections',
              'services', 'case_studies', 'case_study_services', 'cms_members',
              'cms_audit_log', 'cms_global_audit_log', 'cms_revisions', 'inquiries'
            ]) as expected(name)
            where not exists (
              select 1
              from information_schema.tables t
              where t.table_schema = 'public'
                and t.table_name = expected.name
            );
            if missing is not null then
              raise exception 'Missing required public tables: %', missing;
            end if;

            select string_agg(name, ', ' order by name)
              into missing
            from unnest(array[
              'site_settings', 'navigation_items', 'pages', 'page_sections',
              'services', 'case_studies', 'case_study_services', 'cms_members',
              'cms_audit_log', 'cms_global_audit_log', 'cms_revisions', 'inquiries'
            ]) as expected(name)
            where not exists (
              select 1
              from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname = 'public'
                and c.relname = expected.name
                and c.relrowsecurity
            );
            if missing is not null then
              raise exception 'RLS is not enabled on required tables: %', missing;
            end if;

            select string_agg(name, ', ' order by name)
              into missing
            from unnest(array[
              'cms_set_updated_at', 'cms_current_role', 'cms_has_role',
              'cms_prepare_service_publication', 'cms_audit_service_change',
              'cms_validate_case_study_media', 'cms_audit_case_study_change',
              'cms_audit_case_study_relationship_change',
              'cms_prepare_case_study_publication', 'cms_prepare_global_content_update',
              'cms_audit_global_content_change', 'cms_prepare_page_section_update',
              'cms_revision_entity_exists', 'cms_save_revision',
              'cms_publish_revision', 'cms_restore_revision',
              'cms_replace_case_study_services'
            ]) as expected(name)
            where not exists (
              select 1
              from pg_proc p
              join pg_namespace n on n.oid = p.pronamespace
              where n.nspname = 'public'
                and p.proname = expected.name
            );
            if missing is not null then
              raise exception 'Missing required application functions: %', missing;
            end if;

            select string_agg(name, ', ' order by name)
              into missing
            from unnest(array[
              'services_audit_changes', 'case_studies_audit_changes',
              'case_study_services_audit_changes', 'case_studies_validate_media',
              'case_studies_prepare_publication', 'site_settings_global_audit',
              'navigation_items_global_audit', 'pages_global_audit',
              'page_sections_global_audit', 'navigation_items_prepare_global_update',
              'page_sections_prepare_update'
            ]) as expected(name)
            where not exists (
              select 1
              from information_schema.triggers t
              where t.trigger_schema = 'public'
                and t.trigger_name = expected.name
            );
            if missing is not null then
              raise exception 'Missing required application triggers: %', missing;
            end if;

            if exists (
              select 1 from information_schema.triggers
              where trigger_schema = 'public'
                and trigger_name = 'services_prepare_publication'
            ) then
              raise exception 'Obsolete trigger services_prepare_publication is present';
            end if;

            if exists (
              select 1 from information_schema.triggers
              where trigger_schema = 'public'
                and trigger_name = 'pages_prepare_global_update'
            ) then
              raise exception 'Obsolete trigger pages_prepare_global_update is present';
            end if;

            if not exists (
              select 1 from pg_policies
              where schemaname = 'public'
                and tablename = 'cms_revisions'
                and policyname = 'cms members can read revisions'
            ) then
              raise exception 'Revision RLS policy is missing';
            end if;

            if not exists (
              select 1 from storage.buckets
              where id = 'case-study-media'
                and public = false
                and file_size_limit = 2097152
                and allowed_mime_types = array['image/webp']::text[]
            ) then
              raise exception 'Required private case-study-media bucket contract is missing';
            end if;

            if not exists (
              select 1 from pg_policies
              where schemaname = 'storage'
                and tablename = 'objects'
                and policyname = 'cms members can view case study media'
                and cmd = 'SELECT'
                and roles @> array['authenticated']::name[]
            ) then
              raise exception 'Authenticated case-study media read policy is missing';
            end if;

            if not exists (
              select 1 from pg_policies
              where schemaname = 'storage'
                and tablename = 'objects'
                and policyname = 'owners can upload case study media'
                and roles @> array['authenticated']::name[]
            ) then
              raise exception 'Authenticated case-study media insert policy is missing';
            end if;

            if not exists (
              select 1 from pg_policies
              where schemaname = 'storage'
                and tablename = 'objects'
                and policyname = 'owners can update case study media'
                and roles @> array['authenticated']::name[]
            ) then
              raise exception 'Authenticated case-study media update policy is missing';
            end if;

            if not exists (
              select 1 from pg_policies
              where schemaname = 'storage'
                and tablename = 'objects'
                and policyname = 'owners can remove case study media'
                and roles @> array['authenticated']::name[]
            ) then
              raise exception 'Authenticated case-study media delete policy is missing';
            end if;

            if not exists (
              select 1 from pg_policies
              where schemaname = 'storage'
                and tablename = 'objects'
                and policyname = 'published approved case study media is public'
                and cmd = 'SELECT'
                and roles @> array['anon']::name[]
            ) then
              raise exception 'Public approved-media Storage policy is missing';
            end if;

            if not exists (
              select 1 from information_schema.role_table_grants
              where table_schema = 'public'
                and table_name = 'cms_revisions'
                and grantee = 'authenticated'
                and privilege_type = 'SELECT'
            ) then
              raise exception 'Authenticated revision read grant is missing';
            end if;

            if not exists (
              select 1 from information_schema.role_routine_grants
              where routine_schema = 'public'
                and routine_name = 'cms_publish_revision'
                and grantee = 'authenticated'
                and privilege_type = 'EXECUTE'
            ) then
              raise exception 'Authenticated revision publish grant is missing';
            end if;
          end $$;
          SQL
