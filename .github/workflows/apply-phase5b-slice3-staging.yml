name: Apply Phase 5B Slice 3 to crimson-staging once

on:
  push:
    branches:
      - staging
    paths:
      - .github/workflows/apply-phase5b-slice3-staging.yml

permissions:
  contents: read

jobs:
  apply:
    name: Apply the single approved Slice 3 migration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging-supabase
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      EXPECTED_STAGING_REF: sdfbcgctquagfcrkvoyw
      EXPECTED_STAGING_NAME: crimson-staging
      REJECTED_PRODUCTION_IDENTIFIER: ocscolabs-platform-website-crm
      EXPECTED_MIGRATION_COUNT: "25"
      EXPECTED_PRIOR_MIGRATION_COUNT: "24"
      PHASE5_SLICE3_MIGRATION: 20260823030000_backfill_phase5_page_documents.sql
      PGHOST: aws-0-ap-northeast-1.pooler.supabase.com
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres.sdfbcgctquagfcrkvoyw
      PGSSLMODE: require

    steps:
      - name: Check out staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 1

      - name: Enforce staging-only execution
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF:-}" != "refs/heads/staging" ]]; then
            echo "Refusing Slice 3 apply outside refs/heads/staging: ${GITHUB_REF:-unset}"
            exit 1
          fi
          if [[ "${SUPABASE_PROJECT_REF:-}" != "$EXPECTED_STAGING_REF" ]]; then
            echo "Refusing Slice 3 apply: project ref is not the approved staging ref."
            exit 1
          fi
          if [[ "${SUPABASE_PROJECT_REF:-}" == "$REJECTED_PRODUCTION_IDENTIFIER" ]]; then
            echo "Refusing Slice 3 apply: Production identifier was supplied."
            exit 1
          fi
          for required in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [[ -z "${!required:-}" ]]; then
              echo "Refusing Slice 3 apply: $required is missing."
              exit 1
            fi
          done

      - name: Confirm exact Slice 3 migration set
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t canonical_migrations < <(
            find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort
          )
          if [[ "${#canonical_migrations[@]}" != "$EXPECTED_MIGRATION_COUNT" ]]; then
            echo "Refusing Slice 3 apply: expected exactly $EXPECTED_MIGRATION_COUNT canonical migrations, found ${#canonical_migrations[@]}."
            exit 1
          fi
          if ! printf '%s\n' "${canonical_migrations[@]}" | grep -Fxq "$PHASE5_SLICE3_MIGRATION"; then
            echo "Refusing Slice 3 apply: the exact approved migration is missing."
            exit 1
          fi
          echo "Confirmed exactly $EXPECTED_MIGRATION_COUNT canonical migrations and the exact Slice 3 migration."

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Confirm exact staging project identity
        shell: bash
        run: |
          set -euo pipefail

          cli_version="$(supabase --version)"
          if [[ "$cli_version" != *"2.111.0"* ]]; then
            echo "Refusing Slice 3 apply: unexpected Supabase CLI version: $cli_version"
            exit 1
          fi

          project_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$EXPECTED_STAGING_REF")"
          project_ref="$(jq -r '.id // .ref // empty' <<< "$project_json")"
          project_name="$(jq -r '.name // empty' <<< "$project_json")"

          if [[ "$project_ref" != "$EXPECTED_STAGING_REF" || "$project_name" != "$EXPECTED_STAGING_NAME" ]]; then
            echo "Refusing Slice 3 apply: exact staging project identity check failed."
            exit 1
          fi
          echo "Confirmed Supabase project crimson-staging ($EXPECTED_STAGING_REF)."

      - name: Link only the approved staging project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$EXPECTED_STAGING_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase migration list --linked

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Verify exact pre-apply migration ledger
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t canonical_migrations < <(
            find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort
          )
          mapfile -t expected_prior_versions < <(
            printf '%s\n' "${canonical_migrations[@]}" \
              | sed -E 's/^([0-9]{14})_.+\.sql$/\1/' \
              | grep -Fxv "${PHASE5_SLICE3_MIGRATION%%_*}" \
              | sort
          )
          mapfile -t recorded_versions < <(
            PGPASSWORD="$SUPABASE_DB_PASSWORD" \
              psql -Atqc "select version from supabase_migrations.schema_migrations order by version"
          )

          if [[ "${#expected_prior_versions[@]}" != "$EXPECTED_PRIOR_MIGRATION_COUNT" ]]; then
            echo "Refusing Slice 3 apply: expected exactly $EXPECTED_PRIOR_MIGRATION_COUNT prior canonical versions."
            exit 1
          fi
          if [[ "${#recorded_versions[@]}" != "$EXPECTED_PRIOR_MIGRATION_COUNT" ]]; then
            echo "Refusing Slice 3 apply: remote ledger does not contain exactly $EXPECTED_PRIOR_MIGRATION_COUNT prior versions."
            exit 1
          fi

          expected_file="$RUNNER_TEMP/expected-prior-versions.txt"
          recorded_file="$RUNNER_TEMP/recorded-versions.txt"
          printf '%s\n' "${expected_prior_versions[@]}" > "$expected_file"
          printf '%s\n' "${recorded_versions[@]}" > "$recorded_file"
          if ! diff -u "$expected_file" "$recorded_file"; then
            echo "Refusing Slice 3 apply: prior migration versions do not match canonical Git exactly."
            exit 1
          fi

          duplicate_count="$(
            PGPASSWORD="$SUPABASE_DB_PASSWORD" \
              psql -Atqc "select count(*) from (select version from supabase_migrations.schema_migrations group by version having count(*) <> 1) duplicates"
          )"
          if [[ "$duplicate_count" != "0" ]]; then
            echo "Refusing Slice 3 apply: migration ledger contains duplicate versions."
            exit 1
          fi

          slice3_recorded="$(
            PGPASSWORD="$SUPABASE_DB_PASSWORD" \
              psql -Atqc "select count(*) from supabase_migrations.schema_migrations where version = '${PHASE5_SLICE3_MIGRATION%%_*}'"
          )"
          if [[ "$slice3_recorded" != "0" ]]; then
            echo "Refusing Slice 3 apply: Slice 3 is already recorded $slice3_recorded time(s)."
            exit 1
          fi

          echo "Confirmed 24 prior versions exactly once and zero Slice 3 records."

      - name: Verify the only pending migration is Slice 3
        shell: bash
        run: |
          set -euo pipefail

          dry_run_output="$(supabase db push --linked --dry-run 2>&1)"
          printf '%s\n' "$dry_run_output"
          if ! grep -Fq "$PHASE5_SLICE3_MIGRATION" <<< "$dry_run_output"; then
            echo "Refusing Slice 3 apply: dry-run did not identify the exact pending migration."
            exit 1
          fi
          mapfile -t canonical_migrations < <(
            find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort
          )
          for migration in "${canonical_migrations[@]}"; do
            if [[ "$migration" != "$PHASE5_SLICE3_MIGRATION" ]] && grep -Fq "$migration" <<< "$dry_run_output"; then
              echo "Refusing Slice 3 apply: another migration appears pending: $migration"
              exit 1
            fi
          done
          echo "Confirmed the exact single pending migration: $PHASE5_SLICE3_MIGRATION"

      - name: Verify exact Slice 3 data preconditions
        shell: bash
        run: |
          set -euo pipefail

          state_ok="$({
            PGPASSWORD="$SUPABASE_DB_PASSWORD" psql -Atqc "
              with expected(slug, section_key, label, sort_order, is_visible) as (
                values
                  ('home', 'home_intro', 'The work', 10, true),
                  ('home', 'home_capabilities', 'Capabilities', 20, true),
                  ('home', 'home_approach', 'How we work', 30, true),
                  ('home', 'home_proof', 'Proof of work', 40, true),
                  ('home', 'home_contact', 'The next step', 50, true),
                  ('services', 'services_capabilities', 'Capabilities', 10, true),
                  ('about', 'about_principles', 'Working principles', 10, true),
                  ('about', 'about_people', 'The people', 20, true),
                  ('contact', 'contact_process', 'What happens next', 10, true),
                  ('contact', 'contact_form', 'Start the conversation', 20, true)
              ), actual as (
                select page.slug, section.section_key, section.label, section.sort_order, section.is_visible
                from public.page_sections section
                join public.pages page on page.id = section.page_id
                where page.slug in ('home', 'services', 'about', 'contact')
              )
              select case when
                (select count(*) from public.pages where slug in ('home', 'services', 'about', 'contact')) = 4
                and (select count(*) from public.pages where slug in ('home', 'services', 'about', 'contact') and jsonb_typeof(content) = 'array') = 4
                and (select count(*) from actual) = 10
                and not exists (select 1 from expected e where not exists (select 1 from actual a where row(a.*) = row(e.*)))
                and not exists (select 1 from actual a where not exists (select 1 from expected e where row(e.*) = row(a.*)))
                and (select count(*) from public.pages where slug = 'work' and jsonb_typeof(content) = 'array') = 1
                and (select count(*) from public.page_sections section join public.pages page on page.id = section.page_id where page.slug = 'work') = 0
                and (select count(*) from public.pages where slug in ('home', 'services', 'about', 'contact') and jsonb_typeof(content) = 'object') = 0
                and (select count(*) from public.cms_revisions revision join public.pages page on revision.entity_type = 'page' and revision.entity_key = page.id::text where page.slug in ('home', 'services', 'about', 'contact') and jsonb_typeof(revision.payload->'content') = 'object') = 0
                and (select count(*) from information_schema.triggers where trigger_schema = 'public' and trigger_name in ('page_sections_freeze_phase5_updates', 'cms_revisions_freeze_phase5_page_sections')) = 0
                and not exists (select 1 from public.cms_revisions revision join public.page_sections section on revision.entity_type = 'page_section' and revision.entity_key = section.id::text join public.pages page on page.id = section.page_id where page.slug in ('home', 'services', 'about', 'contact') and revision.status in ('draft', 'review'))
              then 'true' else 'false' end;
            "
          } 2>&1)"
          if [[ "$state_ok" != "true" ]]; then
            echo "Refusing Slice 3 apply: exact PageDocument backfill preconditions failed."
            printf '%s\n' "$state_ok"
            exit 1
          fi

          page_section_revision_count_before="$({
            PGPASSWORD="$SUPABASE_DB_PASSWORD" psql -Atqc "
              select count(*)
              from public.cms_revisions revision
              join public.page_sections section
                on revision.entity_type = 'page_section'
               and revision.entity_key = section.id::text
              join public.pages page on page.id = section.page_id
              where page.slug in ('home', 'services', 'about', 'contact')
            "
          })"
          echo "PAGE_SECTION_REVISION_COUNT_BEFORE=$page_section_revision_count_before" >> "$GITHUB_ENV"
          echo "Confirmed exact 10-row registry, five legacy arrays, zero Slice 3 artifacts, and Work isolation."

      - name: Apply exactly the approved Slice 3 migration
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --yes

      - name: Verify final migration ledger and no pending migrations
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t canonical_migrations < <(
            find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort
          )
          mapfile -t recorded_versions < <(
            PGPASSWORD="$SUPABASE_DB_PASSWORD" \
              psql -Atqc "select version from supabase_migrations.schema_migrations order by version"
          )
          expected_file="$RUNNER_TEMP/expected-versions.txt"
          recorded_file="$RUNNER_TEMP/recorded-versions.txt"
          printf '%s\n' "${canonical_migrations[@]}" \
            | sed -E 's/^([0-9]{14})_.+\.sql$/\1/' \
            | sort > "$expected_file"
          printf '%s\n' "${recorded_versions[@]}" > "$recorded_file"
          if ! diff -u "$expected_file" "$recorded_file"; then
            echo "Final migration ledger does not match all canonical Git versions exactly."
            exit 1
          fi
          if [[ "${#recorded_versions[@]}" != "$EXPECTED_MIGRATION_COUNT" ]]; then
            echo "Final migration ledger does not contain exactly $EXPECTED_MIGRATION_COUNT versions."
            exit 1
          fi
          duplicate_count="$(
            PGPASSWORD="$SUPABASE_DB_PASSWORD" \
              psql -Atqc "select count(*) from (select version from supabase_migrations.schema_migrations group by version having count(*) <> 1) duplicates"
          )"
          if [[ "$duplicate_count" != "0" ]]; then
            echo "Final migration ledger contains duplicate versions."
            exit 1
          fi
          slice3_recorded="$(
            PGPASSWORD="$SUPABASE_DB_PASSWORD" \
              psql -Atqc "select count(*) from supabase_migrations.schema_migrations where version = '${PHASE5_SLICE3_MIGRATION%%_*}'"
          )"
          if [[ "$slice3_recorded" != "1" ]]; then
            echo "Expected exactly one recorded Slice 3 migration; found $slice3_recorded."
            exit 1
          fi
          dry_run_output="$(supabase db push --linked --dry-run 2>&1)"
          printf '%s\n' "$dry_run_output"
          if ! grep -qiE 'up to date|nothing to push|no pending' <<< "$dry_run_output"; then
            echo "Final dry-run did not confirm that no migrations remain pending."
            exit 1
          fi
          echo "Final migration ledger matches all canonical versions exactly once; no migrations remain pending."

      - name: Verify PageDocuments snapshots guards and Work isolation
        shell: bash
        run: |
          set -euo pipefail

          state_ok="$({
            PGPASSWORD="$SUPABASE_DB_PASSWORD" psql -Atqc "
              with page_state as (
                select slug, content
                from public.pages
                where slug in ('home', 'services', 'about', 'contact', 'work')
              ), snapshots as (
                select revision.*
                from public.cms_revisions revision
                join public.pages page
                  on revision.entity_type = 'page'
                 and revision.entity_key = page.id::text
                where page.slug in ('home', 'services', 'about', 'contact')
                  and jsonb_typeof(revision.payload->'content') = 'object'
              ), guards as (
                select trg.tgname as trigger_name, pg_get_functiondef(trg.tgfoid) as definition
                from pg_catalog.pg_trigger trg
                join pg_catalog.pg_class relation on relation.oid = trg.tgrelid
                join pg_catalog.pg_namespace namespace on namespace.oid = relation.relnamespace
                where not trg.tgisinternal
                  and namespace.nspname = 'public'
                  and trigger.tgname in ('page_sections_freeze_phase5_updates', 'cms_revisions_freeze_phase5_page_sections')
              )
              select case when
                (select count(*) from page_state where slug in ('home', 'services', 'about', 'contact') and jsonb_typeof(content) = 'object' and content->>'schemaVersion' = '1' and content->>'pageKey' = slug) = 4
                and (select count(*) from page_state where slug = 'work' and jsonb_typeof(content) = 'array') = 1
                and (select count(*) from snapshots) = 4
                and (select count(*) from snapshots where status = 'published' and created_by is null and published_at is not null) = 4
                and (select count(*) from snapshots where status <> 'published' or jsonb_typeof(payload->'content') <> 'object') = 0
                and (select count(*) from guards) = 2
                and (select count(*) from guards where definition ilike '%home%' and definition ilike '%services%' and definition ilike '%about%' and definition ilike '%contact%' and definition not ilike '%work%') = 2
                and (select count(*) from public.page_sections section join public.pages page on page.id = section.page_id where page.slug in ('home', 'services', 'about', 'contact')) = 10
                and (select count(*) from public.page_sections section join public.pages page on page.id = section.page_id where page.slug = 'work') = 0
                and (select count(*) from public.cms_revisions revision join public.page_sections section on revision.entity_type = 'page_section' and revision.entity_key = section.id::text join public.pages page on page.id = section.page_id where page.slug in ('home', 'services', 'about', 'contact')) = "$PAGE_SECTION_REVISION_COUNT_BEFORE"
              then 'true' else 'false' end;
            "
          } 2>&1)"
          if [[ "$state_ok" != "true" ]]; then
            echo "Post-apply PageDocument, snapshot, guard, or Work-isolation verification failed."
            printf '%s\n' "$state_ok"
            exit 1
          fi
          echo "Verified four PageDocuments, four Published snapshots, two scoped guards, readable page_sections, and untouched Work."

      - name: Run existing read-only Phase 5 and release contracts
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql -v ON_ERROR_STOP=1 -f supabase/verification/phase5-contract-alignment.sql
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql -v ON_ERROR_STOP=1 -f supabase/verification/release-contract.sql

      # Temporary execution bridge. Remove in a later Slice 3 closure cleanup
      # PR only after the staging apply and post-apply verification are retained.

