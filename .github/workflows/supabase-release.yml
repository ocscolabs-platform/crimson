name: Apply versioned Supabase migrations

on:
  push:
    branches: [main, staging]
    paths:
      - "supabase/**"
      - "scripts/validate-migrations.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to inspect or migrate"
        required: true
        type: choice
        options: [staging, production]
        default: staging
      apply:
        description: "Apply pending migrations (Production still requires environment approval)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate migration history
        run: npm run validate:migrations

      - name: Production build
        run: npm run build

  staging:
    needs: validate
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/staging') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    runs-on: ubuntu-latest
    environment: staging-supabase
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link staging project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Show staging migration status
        run: supabase migration list --linked

      - name: Validate staging migration plan
        run: supabase db push --linked --dry-run

      - name: Apply staging migrations
        if: ${{ github.event_name == 'push' || inputs.apply == true }}
        run: supabase db push --linked --yes

  production:
    needs: validate
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment. No Production
    # migration can pass this gate without explicit owner approval.
    environment: production-supabase
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Show Production migration status
        run: supabase migration list --linked

      - name: Validate Production migration plan
        run: supabase db push --linked --dry-run

      - name: Apply Production migrations
        # Production is never changed by a push or by merging main. The owner
        # must explicitly dispatch this workflow with apply=true, then approve
        # the production-supabase environment gate.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'production' && inputs.apply == true }}
        run: supabase db push --linked --yes
