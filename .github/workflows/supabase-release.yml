name: Apply versioned Supabase migrations

on:
  push:
    branches: [main, staging]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-release.yml"
      - "scripts/validate-migrations.mjs"
      - "scripts/verify-supabase-catalog-contract.mjs"
      - "scripts/test-supabase-catalog-contract.mjs"
      - "scripts/test-staging-supabase-migration-auto-apply.mjs"
      - "scripts/test-production-supabase-release-safety.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to inspect or migrate"
        required: true
        type: choice
        options: [staging, production]
        default: staging
      apply:
        description: "Apply pending migrations (Production still requires environment approval)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate migration history
        run: npm run validate:migrations

      - name: Test shared Supabase catalog contract
        run: npm run test:supabase-catalog

      - name: Production build
        run: npm run build

  staging:
    needs: validate
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/staging') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    runs-on: ubuntu-latest
    environment: staging-supabase
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      EXPECTED_STAGING_NAME: crimson-staging
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify staging credential presence
        env:
          HAS_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
          HAS_SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD != '' }}
          HAS_SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF != '' }}
        run: |
          set -eu
          missing=0
          if [ "$HAS_SUPABASE_ACCESS_TOKEN" = "true" ]; then
            echo "SUPABASE_ACCESS_TOKEN=PRESENT"
          else
            echo "SUPABASE_ACCESS_TOKEN=MISSING"
            missing=1
          fi
          if [ "$HAS_SUPABASE_DB_PASSWORD" = "true" ]; then
            echo "SUPABASE_DB_PASSWORD=PRESENT"
          else
            echo "SUPABASE_DB_PASSWORD=MISSING"
            missing=1
          fi
          if [ "$HAS_SUPABASE_PROJECT_REF" = "true" ]; then
            echo "SUPABASE_PROJECT_REF=PRESENT"
          else
            echo "SUPABASE_PROJECT_REF=MISSING"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Required staging Supabase configuration is missing."
            exit 1
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Verify exact staging project identity
        shell: bash
        run: |
          set -euo pipefail
          project_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF")"
          project_ref="$(jq -r '.id // .ref // empty' <<< "$project_json")"
          project_name="$(jq -r '.name // empty' <<< "$project_json")"
          if [[ "$project_ref" != "$SUPABASE_PROJECT_REF" || "$project_name" != "$EXPECTED_STAGING_NAME" ]]; then
            echo "Refusing migration: the configured target is not the approved crimson-staging project."
            exit 1
          fi
          echo "Confirmed target project identity: crimson-staging."

      - name: Link staging project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Prepare masked staging shared pooler URL
        shell: bash
        run: |
          set -euo pipefail

          echo "::add-mask::$SUPABASE_DB_PASSWORD"
          encoded_db_password="$(jq -rn --arg value "$SUPABASE_DB_PASSWORD" '$value | @uri')"
          if [[ -z "$encoded_db_password" ]]; then
            echo "Refusing migration: encoded database password is empty."
            exit 1
          fi

          echo "::add-mask::$encoded_db_password"
          pooler_db_url="postgresql://postgres.${SUPABASE_PROJECT_REF}:$encoded_db_password@aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require"
          echo "::add-mask::$pooler_db_url"
          printf 'STAGING_POOLER_DB_URL=%s\n' "$pooler_db_url" >> "$GITHUB_ENV"

          unset encoded_db_password pooler_db_url

      - name: Show staging migration status
        run: supabase migration list --db-url "$STAGING_POOLER_DB_URL"

      - name: Validate staging migration plan
        run: supabase db push --db-url "$STAGING_POOLER_DB_URL" --dry-run

      - name: Enforce staging-only apply boundary
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/staging') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging' && inputs.target == 'staging' && inputs.apply == true) }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF:-}" != "refs/heads/staging" ]]; then
            echo "Refusing migration outside refs/heads/staging."
            exit 1
          fi
          if [[ -z "${SUPABASE_PROJECT_REF:-}" || "${EXPECTED_STAGING_NAME:-}" != "crimson-staging" ]]; then
            echo "Refusing migration: staging target configuration is incomplete."
            exit 1
          fi
          echo "Apply boundary confirmed: staging branch and crimson-staging target."

      - name: Apply staging migrations
        # A protected merge to staging is the normal staging release event. A
        # manual staging dispatch remains available as an explicitly applied
        # recovery path, while Production stays in its separate job/gate.
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/staging') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging' && inputs.target == 'staging' && inputs.apply == true) }}
        run: supabase db push --db-url "$STAGING_POOLER_DB_URL" --yes

      - name: Install PostgreSQL client
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/staging') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging' && inputs.target == 'staging' && inputs.apply == true) }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Verify staging migration parity
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/staging') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging' && inputs.target == 'staging' && inputs.apply == true) }}
        shell: bash
        run: |
          set -euo pipefail

          local_versions_file="$RUNNER_TEMP/canonical-migration-versions.txt"
          remote_versions_file="$RUNNER_TEMP/staging-migration-versions.txt"
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed -E 's/^([0-9]{14})_.+\.sql$/\1/' \
            | sort > "$local_versions_file"

          if [[ ! -s "$local_versions_file" ]]; then
            echo "Canonical migration version extraction returned no versions."
            exit 1
          fi
          if [[ -n "$(uniq -d "$local_versions_file")" ]]; then
            echo "Canonical Git migrations contain duplicate version identifiers."
            exit 1
          fi

          # The approved regional Supabase pooler is IPv4-reachable from
          # GitHub-hosted runners; use it only for this read-only parity query.
          export PGHOST="aws-0-ap-northeast-1.pooler.supabase.com"
          export PGPORT=5432
          export PGDATABASE=postgres
          export PGUSER="postgres.${SUPABASE_PROJECT_REF}"
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          export PGSSLMODE=require
          psql -Atqc "select version from supabase_migrations.schema_migrations order by version" > "$remote_versions_file"

          if [[ ! -s "$remote_versions_file" ]]; then
            echo "Staging migration ledger returned no versions."
            exit 1
          fi
          if [[ -n "$(uniq -d "$remote_versions_file")" ]]; then
            echo "Staging migration ledger contains duplicate version identifiers."
            exit 1
          fi
          if ! diff -u "$local_versions_file" "$remote_versions_file"; then
            echo "Staging migration ledger does not exactly match canonical Git migrations."
            echo "Pending versions (repository minus staging):"
            comm -13 "$remote_versions_file" "$local_versions_file" || true
            echo "Unexpected remote versions (staging minus repository):"
            comm -23 "$remote_versions_file" "$local_versions_file" || true
            exit 1
          fi

          local_count="$(wc -l < "$local_versions_file" | tr -d '[:space:]')"
          remote_count="$(wc -l < "$remote_versions_file" | tr -d '[:space:]')"
          duplicate_count="$(psql -Atqc "select count(*) from (select version from supabase_migrations.schema_migrations group by version having count(*) <> 1) duplicates")"
          latest_version="$(tail -n 1 "$remote_versions_file")"
          if [[ "$duplicate_count" != "0" ]]; then
            echo "Staging migration ledger contains duplicate rows."
            exit 1
          fi
          echo "Staging migration parity verified: ${remote_count}/${local_count}; latest=${latest_version}; duplicates=0; pending=0."

      - name: Verify staging catalog contract
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/staging') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging' && inputs.target == 'staging' && inputs.apply == true) }}
        run: SUPABASE_DB_URL="$STAGING_POOLER_DB_URL" SUPABASE_ENVIRONMENT=staging node scripts/verify-supabase-catalog-contract.mjs --report-case-study-media-policies

  production:
    needs: validate
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment. No Production
    # migration can pass this gate without explicit owner approval.
    environment: production-supabase
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      EXPECTED_PRODUCTION_NAME: ocscolabs-platform-website-crm
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Production configuration presence
        shell: bash
        run: |
          set -euo pipefail

          for required in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [[ -z "${!required:-}" ]]; then
              echo "Refusing release: $required is missing."
              exit 1
            fi
          done

          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          echo "::add-mask::$SUPABASE_DB_PASSWORD"
          echo "Required Production configuration is present."

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Enforce Production-only apply boundary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'production' && inputs.apply == true }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF:-}" != "refs/heads/main" ]]; then
            echo "Refusing Production apply outside refs/heads/main."
            exit 1
          fi
          if [[ -z "${SUPABASE_PROJECT_REF:-}" || "${EXPECTED_PRODUCTION_NAME:-}" != "ocscolabs-platform-website-crm" ]]; then
            echo "Refusing Production apply: target configuration is incomplete."
            exit 1
          fi
          echo "Production apply boundary confirmed: manual main dispatch and approved target."

      - name: Verify exact Production project identity
        shell: bash
        run: |
          set -euo pipefail

          project_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF")"
          project_ref="$(jq -r '.id // .ref // empty' <<< "$project_json")"
          project_name="$(jq -r '.name // empty' <<< "$project_json")"

          if [[ -z "$project_ref" || "$project_ref" != "$SUPABASE_PROJECT_REF" ]]; then
            echo "Refusing release: authenticated project ref does not match the configured Production ref."
            exit 1
          fi
          if [[ "$project_name" != "$EXPECTED_PRODUCTION_NAME" ]]; then
            echo "Refusing release: authenticated project name is not the approved Production project."
            exit 1
          fi

          echo "Exact Production project identity confirmed: $EXPECTED_PRODUCTION_NAME."

      - name: Link Production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Prepare masked Production shared pooler URL
        shell: bash
        run: |
          set -euo pipefail

          encoded_db_password="$(jq -rn --arg value "$SUPABASE_DB_PASSWORD" '$value | @uri')"
          if [[ -z "$encoded_db_password" ]]; then
            echo "Refusing release: encoded database password is empty."
            exit 1
          fi

          echo "::add-mask::$encoded_db_password"
          pooler_db_url="postgresql://postgres.${SUPABASE_PROJECT_REF}:$encoded_db_password@aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require"
          echo "::add-mask::$pooler_db_url"
          printf 'PRODUCTION_POOLER_DB_URL=%s\n' "$pooler_db_url" >> "$GITHUB_ENV"

          unset encoded_db_password pooler_db_url

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Verify Production ledger is a canonical prefix
        shell: bash
        run: |
          set -euo pipefail

          local_versions_file="$RUNNER_TEMP/production-canonical-migration-versions.txt"
          production_versions_file="$RUNNER_TEMP/production-ledger-versions.txt"
          expected_prefix_file="$RUNNER_TEMP/production-expected-prefix-versions.txt"
          pending_versions_file="$RUNNER_TEMP/production-pending-versions.txt"

          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed -nE 's/^([0-9]{14})_.+\.sql$/\1/p' \
            | sort > "$local_versions_file"

          ledger_exists="$(psql "$PRODUCTION_POOLER_DB_URL" -X -Atq -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          set transaction read only;
          select (to_regclass('supabase_migrations.schema_migrations') is not null)::text;
          commit;
          SQL
          )"
          if [[ "$ledger_exists" != "true" ]]; then
            echo "Production migration ledger is absent; explicit reconciliation review is required."
            exit 1
          fi

          psql "$PRODUCTION_POOLER_DB_URL" -X -Atq -v ON_ERROR_STOP=1 > "$production_versions_file" <<'SQL'
          begin;
          set transaction read only;
          select version from supabase_migrations.schema_migrations order by version;
          commit;
          SQL

          for file in "$local_versions_file" "$production_versions_file"; do
            if [[ ! -s "$file" ]]; then
              echo "Migration version extraction returned an empty set."
              exit 1
            fi
            if [[ -n "$(uniq -d "$file")" ]]; then
              echo "Duplicate migration versions detected; explicit reconciliation review is required."
              exit 1
            fi
          done

          if [[ -n "$(comm -23 "$production_versions_file" "$local_versions_file")" ]]; then
            echo "Production contains migration versions absent from canonical Git; refusing release."
            exit 1
          fi

          local_count="$(wc -l < "$local_versions_file" | tr -d '[:space:]')"
          production_count="$(wc -l < "$production_versions_file" | tr -d '[:space:]')"
          head -n "$production_count" "$local_versions_file" > "$expected_prefix_file"
          if ! diff -u "$expected_prefix_file" "$production_versions_file"; then
            echo "Production migration ledger is not an exact canonical prefix; refusing release."
            exit 1
          fi

          comm -13 "$production_versions_file" "$local_versions_file" > "$pending_versions_file"
          pending_count="$(wc -l < "$pending_versions_file" | tr -d '[:space:]')"
          printf 'PRODUCTION_PENDING_COUNT=%s\n' "$pending_count" >> "$GITHUB_ENV"
          echo "Production ledger preflight passed: canonical=${local_count}; applied=${production_count}; pending=${pending_count}; duplicates=0; unexpected=0."

      - name: Verify current Production catalog precondition
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PRODUCTION_PENDING_COUNT" == "0" ]]; then
            SUPABASE_DB_URL="$PRODUCTION_POOLER_DB_URL" \
              SUPABASE_ENVIRONMENT=production-precondition \
              node scripts/verify-supabase-catalog-contract.mjs --report-case-study-media-policies
          else
            echo "Full-current catalog precondition deferred until the pending canonical migrations are applied."
          fi

      - name: Show Production migration status
        run: supabase migration list --db-url "$PRODUCTION_POOLER_DB_URL"

      - name: Validate Production migration plan
        run: supabase db push --db-url "$PRODUCTION_POOLER_DB_URL" --dry-run

      - name: Apply Production migrations
        # Production is never changed by a push or by merging main. The owner
        # must explicitly dispatch this workflow with apply=true, then approve
        # the production-supabase environment gate.
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.target == 'production' && inputs.apply == true }}
        run: supabase db push --db-url "$PRODUCTION_POOLER_DB_URL" --yes

      - name: Verify Production migration parity
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.target == 'production' && inputs.apply == true }}
        shell: bash
        run: |
          set -euo pipefail

          local_versions_file="$RUNNER_TEMP/production-canonical-migration-versions.txt"
          production_versions_file="$RUNNER_TEMP/production-post-apply-versions.txt"
          psql "$PRODUCTION_POOLER_DB_URL" -X -Atq -v ON_ERROR_STOP=1 > "$production_versions_file" <<'SQL'
          begin;
          set transaction read only;
          select version from supabase_migrations.schema_migrations order by version;
          commit;
          SQL

          if [[ ! -s "$production_versions_file" ]]; then
            echo "Production migration ledger returned no versions after apply."
            exit 1
          fi
          if [[ -n "$(uniq -d "$production_versions_file")" ]]; then
            echo "Production migration ledger contains duplicate versions after apply."
            exit 1
          fi
          if ! diff -u "$local_versions_file" "$production_versions_file"; then
            echo "Production migration ledger does not exactly match canonical Git after apply."
            exit 1
          fi

          local_count="$(wc -l < "$local_versions_file" | tr -d '[:space:]')"
          production_count="$(wc -l < "$production_versions_file" | tr -d '[:space:]')"
          echo "Production migration parity verified: ${production_count}/${local_count}; duplicates=0; pending=0."

      - name: Verify Production catalog contract after apply
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.target == 'production' && inputs.apply == true }}
        run: SUPABASE_DB_URL="$PRODUCTION_POOLER_DB_URL" SUPABASE_ENVIRONMENT=production-post-apply node scripts/verify-supabase-catalog-contract.mjs --report-case-study-media-policies
