name: Validate application

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify schema release compatibility
        env:
          SCHEMA_RELEASE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/verify-schema-release-compatibility.mjs --base "$SCHEMA_RELEASE_BASE"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate migration history
        run: npm run validate:migrations

      - name: Test schema release compatibility gate
        run: node --test scripts/test-schema-release-compatibility.mjs

      - name: Build
        run: npm run build
