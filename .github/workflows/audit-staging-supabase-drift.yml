name: Audit staging Supabase schema drift

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Compare canonical migrations with crimson-staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging-supabase
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify staging audit configuration without exposing values
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [[ -n "${!name:-}" ]]; then
              echo "$name=PRESENT"
            else
              echo "$name=MISSING"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Required staging audit configuration is missing. No database was queried."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Build disposable expected database from canonical migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase start
          supabase db reset --local --no-seed
          supabase status -o env > "$RUNNER_TEMP/supabase-env"
          grep '^DB_URL=' "$RUNNER_TEMP/supabase-env" >> "$GITHUB_ENV"

      - name: Snapshot expected schema metadata
        run: |
          mkdir -p artifacts
          node scripts/audit-supabase-drift.mjs snapshot \
            --source expected \
            --output artifacts/expected-state.json

      - name: Snapshot crimson-staging schema metadata read-only
        run: |
          mkdir -p artifacts
          node scripts/audit-supabase-drift.mjs snapshot \
            --source staging \
            --read-only \
            --output artifacts/staging-state.json

      - name: Compare expected and staging metadata
        run: |
          node scripts/audit-supabase-drift.mjs compare \
            --expected artifacts/expected-state.json \
            --actual artifacts/staging-state.json \
            --output artifacts/staging-drift.json

      - name: Upload read-only drift inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-supabase-drift-inventory
          path: artifacts/
          if-no-files-found: warn

      - name: Stop disposable database
        if: always()
        continue-on-error: true
        run: supabase stop --no-backup
